name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install VuePress
        run: |
          npm init -y
          npm install vuepress@1 @vuepress/theme-reco moment vuepress-plugin-code-copy vuepress-plugin-cursor-effects vuepress-plugin-dynamic-title vuepress-plugin-copyright vuepress-plugin-permalink-pinyin vuepress-plugin-sitemap vuepress-plugin-seo

      - name: Build
        run: npx vuepress build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
